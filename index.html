<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis de Highs and Lows</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<header class="topbar">
  <button id="menuToggle" class="menu-toggle" aria-label="Abrir menú">
    <span></span><span></span><span></span>
  </button>
  <h1 class="app-title">Análisis de Highs and Lows</h1>
</header>
<div id="hintBar" class="hint-bar"></div>

<nav id="sideMenu" class="side-menu">
  <div class="side-menu-header">
    <span>Menú</span>
    <button id="menuClose" class="menu-close" aria-label="Cerrar menú">&times;</button>
  </div>
  <ul class="menu-list">
    <li><a href="#" class="menu-item active" data-view="highs-lows">Highs and Lows</a></li>
  </ul>
</nav>
<div id="menuOverlay" class="menu-overlay"></div>

<main class="content">

  <section id="view-highs-lows" class="view">
    <div class="panel filters-panel">
      <div class="filter-row">
        <label for="sheetSelect">Hoja</label>
        <select id="sheetSelect"></select>
      </div>

      <div class="filter-grid">
        <div class="filter-field">
          <label for="minV">V mínimo <span class="filter-value" id="minVVal"></span></label>
          <input type="range" id="minV" min="0" max="100" step="1">
        </div>
        <div class="filter-field">
          <label for="minU">U mínimo <span class="filter-value" id="minUVal"></span></label>
          <input type="range" id="minU" min="0" max="100" step="1">
        </div>
        <div class="filter-field">
          <label for="minB">B mínimo <span class="filter-value" id="minBVal"></span></label>
          <input type="range" id="minB" min="0" max="100" step="1">
        </div>
        <div class="filter-field">
          <label for="minN">N mínimo <span class="filter-value" id="minNVal"></span></label>
          <input type="range" id="minN" min="0" max="100" step="1">
        </div>
        <div class="filter-field">
          <label for="minP">P mínimo <span class="filter-value" id="minPVal"></span></label>
          <input type="range" id="minP" min="0" max="100" step="1">
        </div>
        <div class="filter-field">
          <label for="minPU">PU mínimo <span class="filter-value" id="minPUVal"></span></label>
          <input type="range" id="minPU" min="0" max="100" step="1">
        </div>
        <div class="filter-field">
          <label for="minPB">PB mínimo <span class="filter-value" id="minPBVal"></span></label>
          <input type="range" id="minPB" min="0" max="100" step="1">
        </div>
      </div>

      <div class="filter-actions">
        <button id="resetFilters" class="btn btn-secondary">Restablecer filtros</button>
        <span id="resultCount" class="result-count"></span>
      </div>
    </div>

    <div class="panel table-panel">
      <div class="table-toolbar">
        <button id="downloadPdf" class="btn btn-primary">Descargar PDF</button>
        <button id="shareView" class="btn btn-primary">Compartir</button>
      </div>
      <div class="table-scroll">
        <table id="resultsTable">
          <thead>
            <tr>
              <th data-col="#" class="col-num">#</th>
              <th data-col="Ticker">Ticker</th>
              <th data-col="V">V</th>
              <th data-col="U">U</th>
              <th data-col="B">B</th>
              <th data-col="N">N</th>
              <th data-col="P">P</th>
              <th data-col="PU">PU</th>
              <th data-col="PB">PB</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Análisis de Highs and Lows</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<header class="topbar">
  <button id="menuToggle" class="menu-toggle" aria-label="Abrir menú">
    <span></span><span></span><span></span>
  </button>
  <h1 class="app-title">Análisis de Highs and Lows</h1>
</header>
<div id="hintBar" class="hint-bar"></div>

<nav id="sideMenu" class="side-menu">
  <div class="side-menu-header">
    <span>Menú</span>
    <button id="menuClose" class="menu-close" aria-label="Cerrar menú">&times;</button>
  </div>
  <ul class="menu-list">
    <li><a href="#" class="menu-item active" data-view="highs-lows">Highs and Lows</a></li>
    <li><a href="#" class="menu-item" data-view="recomendaciones">Recomendaciones</a></li>
  </ul>
</nav>
<div id="menuOverlay" class="menu-overlay"></div>

<main class="content">

  <section id="view-highs-lows" class="view">
    <div class="panel filters-panel">
      <div class="filter-row">
        <label for="sheetSelect">Hoja</label>
        <select id="sheetSelect"></select>
      </div>

      <div class="filter-grid">
        <div class="filter-field filter-field--range">
          <label>V</label>
          <div class="range-inputs">
            <input type="number" id="minV" step="1" aria-label="V mínimo">
            <span class="range-sep">–</span>
            <input type="number" id="maxV" step="1" aria-label="V máximo">
          </div>
        </div>
        <div class="filter-field filter-field--range">
          <label>U</label>
          <div class="range-inputs">
            <input type="number" id="minU" step="1" aria-label="U mínimo">
            <span class="range-sep">–</span>
            <input type="number" id="maxU" step="1" aria-label="U máximo">
          </div>
        </div>
        <div class="filter-field filter-field--range">
          <label>B</label>
          <div class="range-inputs">
            <input type="number" id="minB" step="1" aria-label="B mínimo">
            <span class="range-sep">–</span>
            <input type="number" id="maxB" step="1" aria-label="B máximo">
          </div>
        </div>
        <div class="filter-field filter-field--range">
          <label>N</label>
          <div class="range-inputs">
            <input type="number" id="minN" step="1" aria-label="N mínimo">
            <span class="range-sep">–</span>
            <input type="number" id="maxN" step="1" aria-label="N máximo">
          </div>
        </div>
      </div>

      <div class="filter-actions">
        <button id="resetFilters" class="btn btn-secondary">Restablecer filtros</button>
        <span id="resultCount" class="result-count"></span>
      </div>
    </div>

    <div class="panel table-panel">
      <div class="table-toolbar">
        <button id="downloadPdf" class="btn btn-primary">Descargar PDF</button>
        <button id="shareView" class="btn btn-primary">Compartir</button>
      </div>
      <div class="table-scroll">
        <table id="resultsTable">
          <thead>
            <tr>
              <th data-col="#" class="col-num">#</th>
              <th data-col="Ticker">Ticker</th>
              <th data-col="V">V</th>
              <th data-col="U">U</th>
              <th data-col="B">B</th>
              <th data-col="N">N</th>
              <th data-col="P">P</th>
              <th data-col="PU">PU</th>
              <th data-col="PB">PB</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="view-recomendaciones" class="view" hidden>
    <div class="panel filters-panel">
      <div class="filter-row">
        <label for="recSelect">Informe</label>
        <select id="recSelect"></select>
      </div>
      <p id="recEmpty" class="result-count" hidden>Todavía no hay ningún informe del agente en la carpeta PDF.</p>
    </div>

    <div class="panel table-panel" id="recPanel" hidden>
      <div class="table-toolbar">
        <a id="recDownload" class="btn btn-primary" href="#" download>Descargar PDF</a>
        <button id="recShare" class="btn btn-primary">Compartir</button>
      </div>
      <div class="rec-frame-wrap">
        <iframe id="recFrame" class="rec-frame" title="Informe del agente" src="" loading="lazy"></iframe>
      </div>
    </div>
  </section>

</main>

<div id="toast" class="toast"></div>

<script src="app.js"></script>
</body>
</html>
